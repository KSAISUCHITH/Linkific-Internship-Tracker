<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>
    <nav class="navbar">
        <div class="nav-brand">Landing Page</div>
        <button class="theme-toggle" type="button">Toggle Theme</button>
    </nav>

    <header class="hero">
        <div class="hero-content">
            <p class="eyebrow">Explore the journey</p>
            <h1>Nature, moments, and memories in every frame.</h1>
            <p class="subtitle">A calm visual landing page built to feel modern, immersive, and easy to explore.</p>
            <div class="hero-actions">
                <button id="viewGalleryBtn" type="button">View Gallery</button>
            </div>
        </div>
        <div class="hero-visual">
            <img src="images/images (4).jpg" alt="Main scenic view">
        </div>
    </header>

    <div id="statusBanner" class="status-banner" aria-live="polite"></div>

    <main id="gallery" class="gallery-section">
        <div class="section-heading">
            <p>Featured collection</p>
            <h2>Fresh inspiration</h2>
        </div>

        <section class="boxes">
            <article class="box" data-title="Scenic trail" data-description="A peaceful route through green hills.">
                <div class="card-inner">
                    <div class="card-face card-front">
                        <img src="images/images (1).jpg" alt="Image 1">
                    </div>
                    <div class="card-face card-back">
                        <img src="images/sunset-snow-capped-mountains_23-2152014205.avif" alt="Mountain view">
                    </div>
                </div>
            </article>

            <article class="box" data-title="River valley" data-description="Calm waters surrounded by mountains and greenery.">
                <div class="card-inner">
                    <div class="card-face card-front">
                        <img src="images/beautiful-shot-river-through-village-surrounded-by-hills-mountains-greenery_181624-41644.avif" alt="Image 2">
                    </div>
                    <div class="card-face card-back">
                        <img src="images/sunset-snow-capped-mountains_23-2152014205.avif" alt="Mountain view">
                    </div>
                </div>
            </article>

            <article class="box" data-title="Golden horizon" data-description="Warm tones that capture a quiet sunset.">
                <div class="card-inner">
                    <div class="card-face card-front">
                        <img src="images/images.jpg" alt="Image 3">
                    </div>
                    <div class="card-face card-back">
                        <img src="images/sunset-snow-capped-mountains_23-2152014205.avif" alt="Mountain view">
                    </div>
                </div>
            </article>

            <article class="box" data-title="Mountain view" data-description="A tall landscape framed by crisp autumn air.">
                <div class="card-inner">
                    <div class="card-face card-front">
                        <img src="images/images (3).jpg" alt="Image 4">
                    </div>
                    <div class="card-face card-back">
                        <img src="images/sunset-snow-capped-mountains_23-2152014205.avif" alt="Mountain view">
                    </div>
                </div>
            </article>

            <article class="box" data-title="Forest path" data-description="A fresh journey into nature and stillness.">
                <div class="card-inner">
                    <div class="card-face card-front">
                        <img src="images/images (2).jpg" alt="Image 5">
                    </div>
                    <div class="card-face card-back">
                        <img src="images/sunset-snow-capped-mountains_23-2152014205.avif" alt="Mountain view">
                    </div>
                </div>
            </article>

            <article class="box" data-title="Reflection" data-description="A clean scenic shot bringing light and depth together.">
                <div class="card-inner">
                    <div class="card-face card-front">
                        <img src="images/images.jpg" alt="Image 6">
                    </div>
                    <div class="card-face card-back">
                        <img src="images/sunset-snow-capped-mountains_23-2152014205.avif" alt="Mountain view">
                    </div>
                </div>
            </article>

            <article class="box" data-title="Open sky" data-description="A bright, airy scene full of movement and color.">
                <div class="card-inner">
                    <div class="card-face card-front">
                        <img src="images/images (1).jpg" alt="Image 7">
                    </div>
                    <div class="card-face card-back">
                        <img src="images/sunset-snow-capped-mountains_23-2152014205.avif" alt="Mountain view">
                    </div>
                </div>
            </article>

            <article class="box" data-title="Snow peak" data-description="A dramatic mountain line rising above the clouds.">
                <div class="card-inner">
                    <div class="card-face card-front">
                        <img src="images/sunset-snow-capped-mountains_23-2152014205.avif" alt="Image 8">
                    </div>
                    <div class="card-face card-back">
                        <img src="images/sunset-snow-capped-mountains_23-2152014205.avif" alt="Mountain view">
                    </div>
                </div>
            </article>
        </section>
    </main>

    <script src="script/script.js"></script>
</body>

</html>
